[project]
name = "ceylon-lakehouse"
version = "0.1.0"
description = "Medallion-architecture lakehouse over Sri Lankan public data"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

# Pinned to 3.11 deliberately: Databricks Runtime ships 3.11, and a local
# interpreter that drifts ahead of the cluster is a class of bug worth not having.

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "types-pyyaml>=6.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ceylon"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "A",        # flake8-builtins
    "C4",       # flake8-comprehensions
    "DTZ",      # flake8-datetimez — naive datetimes are a data-pipeline hazard
    "T20",      # flake8-print — logging, never print
    "SIM",      # flake8-simplify
    "PTH",      # flake8-use-pathlib
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
pretty = true

# ------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=ceylon",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]

[tool.coverage.run]
branch = true
source = ["src/ceylon"]
