# The same gates CI runs, so failures surface before push rather than in review.
# Keep this file and .github/workflows/ci.yml in step — if they drift, the hooks
# stop being trustworthy and people start passing --no-verify.
default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        args: [--strict]
        # The hook runs mypy in its own isolated environment, so every
        # package the checked code imports must be listed here as well as in
        # pyproject.toml — otherwise the hook and CI disagree.
        additional_dependencies: [pytest>=8.3, types-PyYAML>=6.0, httpx>=0.27]

  # Practice 12: no credential ever reaches a commit.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
